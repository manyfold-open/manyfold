# Versions the tracked packages (CLI and friends) from pending changesets:
# every push to main refreshes a "Version Packages" PR; merging it bumps
# package.json + CHANGELOG.md, and the maintainers cut the release tag from
# the result. Zero repository secrets — GITHUB_TOKEN is enough in-repo.
#
# The manyfold-open ORG forbids GitHub Actions from creating pull requests, so
# the changesets action does all of its work, pushes changeset-release/main,
# and then fails on the final API call. That is not recoverable in-repo: a PAT
# would break the secret-free contract, and the policy is org-wide. So the
# failure is caught and turned into a ready-to-paste command instead of a red
# run every release — a build that is always red teaches people to ignore it.
name: version-pr

on:
    push:
        branches: [main]
    workflow_dispatch: {}

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: version-pr
    cancel-in-progress: false

jobs:
    version:
        if: github.repository == 'manyfold-open/manyfold'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.29.3
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - id: changesets
              continue-on-error: true
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  version: pnpm changeset version
                  title: 'chore(release): version tracked packages'
                  commit: 'chore(release): version tracked packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            # The branch is pushed and correct whether or not the PR could be
            # opened, so recover by looking for the PR rather than by trusting
            # the step's exit code.
            - name: Open the version PR by hand when Actions may not
              if: steps.changesets.outcome == 'failure'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  BRANCH=changeset-release/main
                  if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
                      echo '::error::changesets failed before pushing the version branch — this is a real failure, not the org PR policy'
                      exit 1
                  fi
                  PR=$(gh pr list --head "$BRANCH" --base main --state open \
                      --json url --jq '.[0].url // empty')
                  if [ -n "$PR" ]; then
                      echo "version PR already open: $PR"
                      exit 0
                  fi
                  {
                      echo '### Version PR needs to be opened by hand'
                      echo
                      echo 'The version bump succeeded and `'"$BRANCH"'` is pushed.'
                      echo 'This org does not allow GitHub Actions to create pull'
                      echo 'requests, so run:'
                      echo
                      echo '```sh'
                      echo "gh pr create --base main --head $BRANCH \\"
                      echo "    --title 'chore(release): version tracked packages'"
                      echo '```'
                      echo
                      echo 'The title is load-bearing: sync-release-to-develop'
                      echo 'matches on it to open the back-merge.'
                  } >>"$GITHUB_STEP_SUMMARY"
                  echo '::warning::version branch pushed; open the PR by hand (see the run summary)'
