# Editions §7.1/§9 M3: one edition tag (v*) produces the deployable
# artifacts — GHCR images for the three deployable apps, attached to a GitHub
# Release. Zero repository secrets: GHCR pushes use the workflow's
# GITHUB_TOKEN (packages: write).
#
# The CLI is NOT built here. It has its own train (release-cli / release-cli-dev)
# because it versions independently: the edition tag and the CLI version have
# never matched, and coupling them meant a CLI fix waited for an edition
# release. install.sh resolves a channel manifest, not `releases/latest`, so
# dropping the CLI assets from this release breaks no installer.
#
# Images are linux/amd64 for now: arm64 needs the free-for-public-repos arm
# runners (native-module compiles under QEMU blow the timeout); add an
# ubuntu-24.04-arm leg + a manifest merge once the repo is public.
name: release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: 'existing tag (e.g. v0.1.0)'
                required: true

permissions:
    contents: write
    packages: write

concurrency:
    group: release-${{ github.event.inputs.tag || github.ref_name }}
    cancel-in-progress: false

jobs:
    docker-images:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                app: [api, web, admin]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}
            - name: Build and push ghcr.io image
              run: |
                  TAG='${{ github.event.inputs.tag || github.ref_name }}'
                  case "$TAG" in
                      v[0-9]*) ;;
                      *) echo "::error::'$TAG' is not a version tag (vX.Y.Z)"; exit 1 ;;
                  esac
                  VERSION="${TAG#v}"
                  OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
                  IMAGE="ghcr.io/$OWNER/manyfold-${{ matrix.app }}"
                  echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io \
                      -u '${{ github.actor }}' --password-stdin
                  docker build -f 'apps/${{ matrix.app }}/Dockerfile' \
                      -t "$IMAGE:$VERSION" .
                  docker push "$IMAGE:$VERSION"
                  # Tags with a pre-release suffix (v1.2.3-rc.1) never move :latest.
                  case "$VERSION" in
                      *-*) echo "pre-release: not tagging $IMAGE:latest" ;;
                      *)
                          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
                          docker push "$IMAGE:latest"
                          ;;
                  esac

    release:
        needs: [docker-images]
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}
            - name: Create the GitHub Release
              run: |
                  TAG='${{ github.event.inputs.tag || github.ref_name }}'
                  VERSION="${TAG#v}"
                  OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
                  {
                      echo '## Container images'
                      echo
                      echo '```'
                      for app in api web admin; do
                          echo "docker pull ghcr.io/$OWNER/manyfold-$app:$VERSION"
                      done
                      echo '```'
                      echo
                      echo 'The api image is configured entirely by environment'
                      echo '(see `.env.selfhost.example`). The web and admin images'
                      echo 'serve bundles that call the API at same-origin `/api`:'
                      echo 'front them with a reverse proxy that routes `/api/*` to'
                      echo 'the api container, or build from source with'
                      echo '`VITE_API_URL` baked for a split-origin layout'
                      echo '(`docker-compose.selfhost.yml` does the latter).'
                      echo
                      echo '## CLI'
                      echo
                      echo 'The mf CLI has its own release train: install it with'
                      echo '`curl -fsSL https://manyfold.ai/cli/install.sh | sh`, or'
                      echo 'pick a build from the `cli-v*` releases.'
                      echo
                  } > notes.md
                  PRERELEASE=''
                  case "$VERSION" in
                      *-*) PRERELEASE='--prerelease' ;;
                  esac
                  gh release create "$TAG" \
                      --title "Manyfold $TAG" \
                      --notes-file notes.md \
                      --generate-notes \
                      $PRERELEASE
