# Zero-secret CI (editions §7): every job runs on fork PRs with no
# credentials. The pg lane uses a workflow-local postgres service.
name: ci
on:
    push:
        # develop too: its ci-ok is what gates the dev CLI channel
        # (release-cli-dev) and what the superproject's oss-bump leg polls
        # before moving the submodule pointer.
        branches: [main, develop]
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Resolve the PR's affected graph once. Draft PRs intentionally stop here:
    # converting one to ready-for-review emits a ready_for_review event and
    # starts the full set of checks.
    prepare:
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            base: ${{ steps.affected.outputs.base }}
            force_all: ${{ steps.affected.outputs.force_all }}
            has_affected: ${{ steps.affected.outputs.has_affected }}
            api: ${{ steps.affected.outputs.api }}
            web: ${{ steps.affected.outputs.web }}
            admin: ${{ steps.affected.outputs.admin }}
            cli_content: ${{ steps.affected.outputs.cli_content }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.29.3
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - name: Resolve affected base
              env:
                  CI_PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
              run: scripts/ci-scm-base.sh
            - name: Detect affected packages
              id: affected
              run: |
                  set -euo pipefail
                  affected="$(pnpm exec turbo ls --affected --output=json)"
                  force_all="$CI_FORCE_ALL"
                  # Branch pushes remain the complete post-merge release gate;
                  # only PRs use the affected-package shortcuts.
                  if [ "$GITHUB_EVENT_NAME" = 'push' ] || [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
                      force_all=true
                  fi

                  has_name() {
                      printf '%s' "$affected" | jq -e --arg name "$1" \
                          '.packages.items | map(.name) | index($name) != null' > /dev/null
                  }
                  emit() {
                      printf '%s\n' "$1" >> "$GITHUB_OUTPUT"
                  }

                  emit "base=$TURBO_SCM_BASE"
                  emit "force_all=$force_all"
                  if [ "$force_all" = 'true' ]; then
                      emit 'has_affected=true'
                      emit 'api=true'
                      emit 'web=true'
                      emit 'admin=true'
                      emit 'cli_content=true'
                      exit 0
                  fi

                  if printf '%s' "$affected" | jq -e '.packages.items | length > 0' > /dev/null; then
                      emit 'has_affected=true'
                  else
                      emit 'has_affected=false'
                  fi

                  for surface in api web admin; do
                      if has_name "@manyfold/$surface"; then
                          emit "$surface=true"
                      else
                          emit "$surface=false"
                      fi
                  done

                  if has_name '@manyfold/cli' || has_name '@manyfold/docs'; then
                      emit 'cli_content=true'
                  else
                      emit 'cli_content=false'
                  fi
            # This is the only PR-specific release gate. Failing it prevents
            # every heavyweight job from starting for an incomplete PR.
            - if: github.event_name == 'pull_request'
              run: pnpm changeset-presence:check

    static-checks:
        needs: prepare
        if: needs.prepare.result == 'success'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # changeset-presence:check diffs the PR against its base, so
                  # this job needs history rather than the default depth-1.
                  fetch-depth: 0
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.29.3
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - name: Resolve affected base
              env:
                  CI_PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
              run: scripts/ci-scm-base.sh
            - name: Typecheck affected packages
              run: |
                  if [ "${{ needs.prepare.outputs.force_all }}" = 'true' ]; then
                      pnpm exec turbo run check --concurrency=5
                  else
                      pnpm exec turbo run check --affected --concurrency=5
                  fi
            - run: pnpm force-exit:check
            - run: pnpm lint
            # Docs-site CLI reference + changelog must track the CLI version;
            # spans apps/cli and apps/docs, so no single affected package
            # covers it.
            - if: needs.prepare.outputs.cli_content == 'true'
              run: pnpm cli-content:check
            - run: pnpm knip
            - run: node scripts/check-migration-ownership.mjs
            - run: node --test scripts/check-migration-ownership.test.mjs
            # The env-seal wrapper that the pg lane runs its suites through. If
            # it silently stopped sealing, that lane would keep reporting green
            # while inheriting whatever credentials the runner had, so its own
            # tests run here.
            - run: pnpm sealed-env:check
            # The card check only applies when the Web surface is affected.
            - if: needs.prepare.outputs.web == 'true'
              run: pnpm social-card:check

    api-tests:
        needs: prepare
        if: needs.prepare.result == 'success' && needs.prepare.outputs.api == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.29.3
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec turbo run build --filter='@manyfold/api^...'
            - name: Run api tests (shard ${{ matrix.shard }}/4)
              working-directory: apps/api
              run: |
                  mapfile -t files < <(
                      find test -maxdepth 1 -name '*.test.ts' -print \
                          | sort \
                          | awk "NR % 4 == ${{ matrix.shard }} - 1"
                  )
                  node ../../scripts/test-sealed-env.mjs -- node --import tsx --test "${files[@]}"

    pg-tests:
        needs: prepare
        if: needs.prepare.result == 'success' && needs.prepare.outputs.api == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: manyfold
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s --health-timeout 5s --health-retries 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.29.3
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - name: Build workspace dependencies
              run: pnpm exec turbo run build --filter='@manyfold/api^...' --concurrency=5
            - name: Migrate (open-source entrypoint)
              working-directory: apps/api
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/manyfold
              run: pnpm exec tsx src/db/migrate.ts
            - name: Run pg suites
              working-directory: apps/api
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/manyfold
                  RUN_PG_E2E: '1'
                  # The chat-retention tests are destructive, so they build and
                  # drop their own throwaway database instead of touching the
                  # shared one; without these they fail outright.
                  PG_TEST_SCRATCH: '1'
                  PG_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
              # --test-concurrency=1: the suite shares one database and is not
              # parallel-safe as a whole. Every file must release its resources
              # and exit naturally.
              run: |
                  node ../../scripts/test-sealed-env.mjs -- node --import tsx --test --test-concurrency=1 test/*.pg.test.ts

    smoke-boot:
        needs: prepare
        if: needs.prepare.result == 'success' && needs.prepare.outputs.api == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: manyfold
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s --health-timeout 5s --health-retries 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.29.3
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - name: Build the API and its dependencies
              run: pnpm exec turbo run build --filter=@manyfold/api --concurrency=5
            - name: Migrate the scratch database
              # migrate.js resolves ./drizzle relative to the CWD.
              working-directory: apps/api
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/manyfold
              run: node dist/db/migrate.js
            - name: Boot the API against a scratch database
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/manyfold
              run: node scripts/smoke-boot-api.mjs

    package-tests:
        needs: prepare
        if: needs.prepare.result == 'success' && needs.prepare.outputs.has_affected == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.29.3
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - name: Resolve affected base
              env:
                  CI_PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
              run: scripts/ci-scm-base.sh
            - name: Run affected package tests
              run: |
                  if [ "${{ needs.prepare.outputs.force_all }}" = 'true' ]; then
                      pnpm exec turbo run test --filter='!@manyfold/api'
                  else
                      pnpm exec turbo run test --filter="...[${TURBO_SCM_BASE}]" --filter='!@manyfold/api'
                  fi

    secret-scan:
        needs: prepare
        if: needs.prepare.result == 'success'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            # The gitleaks CLI directly (the marketplace action demands a paid
            # license key on organization repos, which would break the
            # zero-secret contract). Image pinned by digest.
            - name: Scan with gitleaks
              run: |
                  docker run --rm -v "$PWD:/repo" \
                      ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
                      detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact

    # The quickstart is `docker compose up --build`; prove every image the
    # compose file references builds from a bare clone of this tree. Separate
    # jobs let affected detection skip an entire app's runner allocation.
    docker-build-api:
        needs: prepare
        if: needs.prepare.result == 'success' && needs.prepare.outputs.api == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: docker build -f apps/api/Dockerfile .

    docker-build-web:
        needs: prepare
        if: needs.prepare.result == 'success' && needs.prepare.outputs.web == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: docker build -f apps/web/Dockerfile .

    docker-build-admin:
        needs: prepare
        if: needs.prepare.result == 'success' && needs.prepare.outputs.admin == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: docker build -f apps/admin/Dockerfile .

    ci-ok:
        needs: [prepare, static-checks, api-tests, pg-tests, smoke-boot, package-tests, secret-scan, docker-build-api, docker-build-web, docker-build-admin]
        if: always()
        runs-on: ubuntu-24.04
        steps:
            - name: Verify all jobs passed
              run: |
                  results='${{ toJSON(needs) }}'
                  echo "$results"
                  if echo "$results" | grep -Eq '"result": "(failure|cancelled)"'; then
                      echo 'a required job failed or was cancelled' >&2
                      exit 1
                  fi
