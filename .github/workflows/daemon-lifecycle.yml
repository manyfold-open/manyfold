name: daemon-lifecycle

on:
    pull_request:
        branches: [develop, main]
        paths:
            - 'apps/cli/**'
            - 'packages/shared/**'
            - 'pnpm-lock.yaml'
            - '.node-test-headers.json'
            - '.node-test-version'
            - 'scripts/check-test-runtime.mjs'
            - 'scripts/rebuild-test-native.mjs'
            - '.github/workflows/daemon-lifecycle.yml'
            - '.github/workflows/release-cli.yml'
            - '.github/workflows/release-cli-dev.yml'
    push:
        branches: [develop, main]
        paths:
            - 'apps/cli/**'
            - 'packages/shared/**'
            - 'pnpm-lock.yaml'
            - '.node-test-headers.json'
            - '.node-test-version'
            - 'scripts/check-test-runtime.mjs'
            - 'scripts/rebuild-test-native.mjs'
            - '.github/workflows/daemon-lifecycle.yml'
            - '.github/workflows/release-cli.yml'
            - '.github/workflows/release-cli-dev.yml'
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    group: daemon-lifecycle-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    ownership:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                      target: bun-linux-x64
                    - os: macos-15
                      target: bun-darwin-arm64
                    - os: macos-15-intel
                      target: bun-darwin-x64
                    # pnpm 10.29.3 bundles node-gyp 11.5, which recognizes VS2022
                    # but not VS2026 (now used by windows-latest/windows-2025).
                    - os: windows-2022
                      target: bun-windows-x64
        env:
            MF_CLI_CHANNEL: dev
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
              with:
                  version: 10.29.3
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version-file: .node-test-version
                  cache: pnpm
            - run: node scripts/check-test-runtime.mjs
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: latest
            - name: Select Python for Windows native builds
              if: runner.os == 'Windows'
              shell: pwsh
              # Match node-gyp 11.5's Windows Node24 matrix: Python 3.14 is
              # excluded there due to nodejs/node#59983.
              run: |
                  $python = py -3.13 -c "import sys; print(sys.executable)"
                  if ($LASTEXITCODE -ne 0) { throw 'Python 3.13 is required for native builds' }
                  Write-Host "Native build Python: $python"
                  & $python --version
                  if ($LASTEXITCODE -ne 0) { throw 'Selected Python cannot execute' }
                  "NODE_GYP_FORCE_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            - run: pnpm install --frozen-lockfile
            - run: pnpm test-native:prepare
            - name: Verify Windows SQLite addon
              if: runner.os == 'Windows'
              run: |
                  node -e "const assert = require('node:assert/strict'); const Database = require('better-sqlite3'); const db = new Database(':memory:'); assert.equal(db.prepare('select 1 as value').get().value, 1); db.close(); console.log('SQLite addon loaded:', process.version, 'ABI', process.versions.modules)"
            - run: pnpm exec turbo run build --filter='@manyfold/cli^...' --concurrency=2
            - name: Compile the standalone ownership worker
              working-directory: apps/cli
              run: |
                  bun build --compile --minify --bytecode --sourcemap \
                    --external=fs-native-extensions \
                    --outfile=dist-bin/daemon-owner-worker.exe \
                    test/fixtures/daemon-owner-worker.ts
                  bun build --compile --minify \
                    --outfile=dist-bin/shell-probe-worker.exe \
                    test/fixtures/shell-probe-worker.ts
            - name: Verify Node and standalone Bun ownership
              working-directory: apps/cli
              run: |
                  MF_TEST_LOCK_WORKER="$(node -p "require('node:path').resolve('dist-bin/daemon-owner-worker.exe')")"
                  MF_TEST_SHELL_WORKER="$(node -p "require('node:path').resolve('dist-bin/shell-probe-worker.exe')")"
                  export MF_TEST_LOCK_WORKER MF_TEST_SHELL_WORKER
                  node ../../scripts/test-sealed-env.mjs -- node \
                    --import tsx --import ./test/md-text-loader.mjs \
                    --test --test-concurrency=2 \
                    test/atomic-rename.test.ts \
                    test/protected-replace.test.ts \
                    test/daemon-pid.test.ts \
                    test/daemon-ownership-process.test.ts \
                    test/daemon-control.test.ts \
                    test/daemon-lock-exited-process.test.ts \
                    test/shell-probe.test.ts \
                    test/daemon-login-shell-path.test.ts \
                    test/exec-resources.test.ts \
                    test/ws-client-lifecycle.test.ts \
                    test/ws-client-hello.test.ts
            - name: Verify Bun owned exec resources
              working-directory: apps/cli
              run: node ../../scripts/test-sealed-env.mjs -- bun test test/exec-resources.test.ts
            - name: Verify Bun exec auth cleanup ordering
              # These auth fixtures use POSIX vendor shell stubs. Windows keeps
              # the Node/standalone ownership and native-artifact gates above.
              if: runner.os != 'Windows'
              working-directory: apps/cli
              run: |
                  node ../../scripts/test-sealed-env.mjs -- bun test \
                    test/daemon-runtime-auth.test.ts \
                    --test-name-pattern 'exec completion|exec .* owns one'
            - run: pnpm --filter '@manyfold/cli...' build
            - name: Build and verify the native release artifact
              run: |
                  node apps/cli/scripts/build-binary.mjs ${{ matrix.target }}
                  pnpm --filter @manyfold/cli exec tsx scripts/verify-binary-artifact.ts ${{ matrix.target }}
            - name: Verify isolated signed foreground and launchd startup
              if: runner.os == 'macOS'
              env:
                  RUN_DAEMON_STARTUP_E2E: '1'
              run: pnpm --filter @manyfold/cli test:startup-e2e dist-bin/mf dist-bin/startup-report
