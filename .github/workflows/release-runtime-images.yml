# The image every Kubernetes pod host runs (ADR-0035), published as
# ghcr.io/manyfold-open/manyfold-runtime-host at an immutable sha-<12> tag of
# the commit that built it. Frameworks are installed into a host on demand, so
# there is no per-framework image. Zero repository secrets: pushes use the
# workflow's GITHUB_TOKEN (packages: write). That token can only push to a
# package linked to this repository or one that lists it with the Write role
# under "Manage Actions access"; a package first pushed from elsewhere needs
# the latter.
name: release-runtime-images

on:
    push:
        branches: [develop]
        paths:
            - 'docker/**'
            - '!docker/*.test.mjs'
            - '.github/workflows/release-runtime-images.yml'
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: release-runtime-images-${{ github.ref }}
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    IMAGE_OWNER: manyfold-open

jobs:
    host:
        if: github.repository == 'manyfold-open/manyfold'
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        outputs:
            tag: ${{ steps.meta.outputs.tag }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - id: meta
              name: Resolve immutable image coordinates
              run: |
                  set -euo pipefail
                  source_sha="$(git rev-parse HEAD)"
                  tag="sha-${source_sha:0:12}"
                  image="${REGISTRY}/${IMAGE_OWNER}/manyfold-runtime-host"
                  {
                      echo "source_sha=$source_sha"
                      echo "tag=$tag"
                      echo "image=$image"
                  } >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Login to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: build
              name: Build and push host
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: docker/host
                  file: docker/host/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
                  cache-from: type=gha,scope=runtime-host
                  cache-to: type=gha,mode=max,scope=runtime-host

            - name: Verify host
              env:
                  IMAGE: ${{ steps.meta.outputs.image }}
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail
                  docker buildx imagetools inspect "${IMAGE}@${DIGEST}" >/dev/null
                  printf 'host: %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

    public:
        needs: host
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Verify the image is anonymously readable
              env:
                  TAG: ${{ needs.host.outputs.tag }}
              run: |
                  set -euo pipefail
                  image="${REGISTRY}/${IMAGE_OWNER}/manyfold-runtime-host:${TAG}"
                  if ! docker buildx imagetools inspect "$image" >/dev/null; then
                      echo "::error::runtime image is not public: $image"
                      exit 1
                  fi
                  printf 'host: %s\n' "$image" >> "$GITHUB_STEP_SUMMARY"
