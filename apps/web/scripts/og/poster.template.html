<!doctype html>
<!--
    Art source for the exported social card. poster.ts fills the placeholders
    from the @manyfold/i18n landing hero keys and inlines poster.css plus the
    pinned faces into the style block, so this file holds layout only — never
    copy. Editing it changes the committed PNGs, so re-run the render.
-->
<html lang="{{lang}}">
    <head>
        <meta charset="UTF-8" />
        <title>Manyfold social card — {{locale}}</title>
        <style>
            {{styles}}
        </style>
    </head>
    <body>
        <div class="poster">
            <div class="p-chassis"></div>
            <div class="p-screws"></div>
            <div class="p-groove"></div>
            <div class="p-lip"></div>
            <div class="p-row">
                <span class="p-brand">
                    <svg viewBox="0 0 135 100" aria-hidden="true">
                        <polygon
                            points="10,80 35,15 47.5,15 22.5,80"
                            fill="#101013"
                        />
                        <polygon
                            points="35,15 60,80 47.5,15 72.5,80"
                            fill="#2a2b30"
                        />
                        <polygon
                            points="60,80 85,15 72.5,80 97.5,15"
                            fill="#101013"
                        />
                        <polygon
                            points="85,15 110,80 97.5,15 122.5,80"
                            fill="#2a2b30"
                        />
                    </svg>
                    Manyfold
                </span>
                <span class="p-domain">manyfold.ai</span>
            </div>
            <div class="p-body">
                <h1 class="p-h1">{{title}}</h1>
                <p class="p-sub">{{tagline}}</p>
            </div>
        </div>
    </body>
</html>
