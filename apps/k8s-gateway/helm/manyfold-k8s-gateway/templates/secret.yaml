{{- if and (not .Values.auth.existingSecret) .Values.auth.token }}
apiVersion: v1
kind: Secret
metadata:
    name: {{ include "mkg.secretName" . }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "mkg.labels" . | nindent 8 }}
type: Opaque
stringData:
    MF_K8S_GATEWAY_TOKEN: {{ .Values.auth.token | quote }}
{{- else if not .Values.auth.existingSecret }}
{{- fail "set auth.token (the chart creates the Secret) or auth.existingSecret (a Secret carrying MF_K8S_GATEWAY_TOKEN)" }}
{{- end }}
