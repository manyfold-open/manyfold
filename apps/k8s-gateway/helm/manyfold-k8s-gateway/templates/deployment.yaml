apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ include "mkg.fullname" . }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "mkg.labels" . | nindent 8 }}
spec:
    replicas: {{ .Values.replicaCount }}
    revisionHistoryLimit: 5
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    selector:
        matchLabels:
            {{- include "mkg.selectorLabels" . | nindent 12 }}
    template:
        metadata:
            labels:
                {{- include "mkg.labels" . | nindent 16 }}
        spec:
            serviceAccountName: {{ include "mkg.fullname" . }}
            automountServiceAccountToken: true
            securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                fsGroup: 65532
                seccompProfile:
                    type: RuntimeDefault
            {{- with .Values.nodeSelector }}
            nodeSelector:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.tolerations }}
            tolerations:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.affinity }}
            affinity:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            containers:
                - name: gateway
                  image: '{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}'
                  imagePullPolicy: {{ .Values.image.pullPolicy }}
                  ports:
                      - name: http
                        containerPort: 3000
                        protocol: TCP
                  env:
                      - name: PORT
                        value: '3000'
                      - name: HOST
                        value: '0.0.0.0'
                      - name: LOG_LEVEL
                        value: {{ .Values.logLevel | quote }}
                      - name: DEFAULT_EXEC_TIMEOUT_MS
                        value: {{ .Values.defaultExecTimeoutMs | quote }}
                  envFrom:
                      - secretRef:
                            name: {{ include "mkg.secretName" . }}
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ['ALL']
                  resources:
                      {{- toYaml .Values.resources | nindent 22 }}
                  readinessProbe:
                      httpGet:
                          path: /healthz
                          port: http
                      initialDelaySeconds: 2
                      periodSeconds: 5
                      timeoutSeconds: 2
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: http
                      initialDelaySeconds: 10
                      periodSeconds: 15
                      timeoutSeconds: 3
                      failureThreshold: 3
