apiVersion: v1
kind: Service
metadata:
    name: {{ include "mkg.fullname" . }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "mkg.labels" . | nindent 8 }}
spec:
    type: {{ .Values.service.type }}
    selector:
        {{- include "mkg.selectorLabels" . | nindent 8 }}
    ports:
        - name: http
          protocol: TCP
          port: {{ .Values.service.port }}
          targetPort: http
