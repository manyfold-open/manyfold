services:
    postgres:
        image: postgres:16
        container_name: manyfold-pg
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: nca
        ports:
            - '5432:5432'
        volumes:
            - manyfold-pg-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d nca']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    manyfold-pg-data:
